---
name: Config Module
groups:

  - name: Configuration
    tests:
      - command: config
        name: List of modules
        expect:
          - Module Config \(\d+\)
          - Quick config
      - command: config mod
        name: Configure unknown module
        expect: Could not find module
      - command: config RAID_MODULE
        name: Configure the RAID_MODULE
        expect:
          - RAID_MODULE Configuration
          - entire module
          - auctions only for people in the raid
      - command: config mod SYSTEM disable all
        name: Disable the SYSTEM module
        expect: Updated status of module.*SYSTEM.*to.*disabled
      - command: config mod SYSTEM disable msg
        name: Disable only commands via the msg-channel in module SYSTEM
        expect: Updated status of module.*SYSTEM.*in permission set.*msg.*to.*disabled
      - command: config mod SYSTEM enable priv
        name: Enable only commands via the priv-channel in module SYSTEM
        expect: Updated status of module.*SYSTEM.*in permission set.*priv.*to.*enabled.
      - command: config mod SYSTEM enable all
        name: Re-enable the SYSTEM module
        expect: Updated status of module.*SYSTEM.*to.*enabled
      - command: help config
        name: Get help for the !config-command
        expect: Help \(config\)
      - command: config cmd disable guild
        name: Disable all guild-commands
        expect: Successfully.*disabled.*all guild commands
      - command: config cmd enable guild
        name: Re-enable all guild-commands
        expect: Successfully.*enabled.*all guild commands
      - command: config cmd raid disable all
        name: Disable the !raid-command
        expect: to.*disabled
      - command: raid
        name: Calling the disabled command gives error
        expect: Unknown command
      - command: config cmd raid enable all
        name: Re-enable the !raid-command
        expect: Updated status.*to.*enabled
      - command: config subcmd raid join/leave disable guild
        name: Disable the "!raid join/leave" sub-command for guild
        expect: Updated status of subcommand.*raid join/leave.*to.*disabled.*in permission set.*guild
      - command: config subcmd raid join/leave enable guild
        name: Re-enable the "!raid join/leave" sub-command for guild
        expect: Updated status of subcommand.*raid join/leave.*to.*enabled.*in permission set.*guild

      - command: config event joinpriv privatechannelcontroller.joinPrivateChannelRecordEvent enable all
        name: Enable a specific event
        expect: Updated status.*enabled

      - command: config cmd raid
        name: Manage access levels of a command and its sub-commands
        expect:
          - Available Subcommands in msg
          - Set access level
      - command: config cmd raid admin msg member
        name: Change access level of "!raid"-command for channel"msg" to member
        expect: Updated access.*raid.*permission set.*msg.*Member
      - command: config cmd raid admin all member
        name: Change access level of "!raid"-command for all channels to member
        expect: Updated access.*raid.*to.*Member
      - command: config cmd raid admin msg all
        name: Change access level of "!raid"-command for channel "msg" to all
        expect: Updated access.*raid.*permission set.*msg.*All
      - command: config cmd raid admin all all
        name: Change access level of "!raid"-command for all channels to all
        expect: Updated access.*raid.*to.*All

      - command: config subcmd news add/change/delete admin msg mod
        name: Change the access level for the sub-command "!news add/change/delete" via channel msg to Moderators
        expect: Updated access of subcommand.*news add/change/delete.*in permission set.*msg.*to.*Moderator
      - command: config subcmd news add/change/delete admin all mod
        name: Change the access level for the sub-command "!news add/change/delete" to Moderators
        expect: Updated access of subcommand.*news add/change/delete.*to.*Moderator

  - name: Settings
    tests:
      - command: settings
        name: List all settings
        expect:
          - Bot Settings
          - ALTS
          - BAN
      - command: settings change alts_require_confirmation
        name: See possible values for a setting
        expect: Predefined Options
      - command: settings save alts_require_confirmation 1
        name: Change a bool setting
        expect: has been saved with new value

  - name: Aliases
    tests:
      - command: alias list
        name: List all aliases
        expect: whompahs
      - command: alias add xxx do secret stuff
        name: Add an alias
        expect: Alias.*added successfully
      - command: alias add xxx do other secret stuff
        name: Try to add an already existing alias
        expect: name already exists
      - command: alias rem xxx
        name: Remove an alias
        expect: removed successfully

  - name: Eventlist
    tests:
      - command: eventlist to
        name: Search existing word-part in eventlist
        expect: raid\(stop\)
      - command: eventlist tower
        name: Search existing word in eventlist
        expect: tower-attack-info
      - command: eventlist rfwefwefji
        name: Search for non-existing event type
        expect: No events of type

  - name: Command list
    tests:
      - command: cmdlist
        name: List all known commands
        expect: whatbuffsfroob
      - command: cmdlist superadmin
        name: List commands only available to Superadmins
        expect: upgradeconfig
      - command: cmdlist xyz
        name: List commands available to non-existing access level
        expect: Unknown access level