---
name: Tracker Module
groups:

  - name: Basic functions
    tests:
      - command: executesql DELETE FROM tracked_users_<myname>
        name: Clear table tracked_users_<myname>
        expect: Query run successfully
      - command: executesql DELETE FROM tracking_<myname>
        name: Clear table tracking_<myname>
        expect: Query run successfully
      - command: executesql DELETE FROM tracking_org_member_<myname>
        name: Clear table tracking_org_member_<myname>
        expect: Query run successfully
      - command: executesql DELETE FROM tracking_org_<myname>
        name: Clear table tracking_org_<myname>
        expect: Query run successfully

      - command: whois Regolus
        name: Cache dummy whois information
        expect:
          - Detailed Info for Regolus
          - 'Character ID: <highlight>(?<uid>\d+)<end>'
      - command: track
        name: Our current tracking list is empty
        expect: No characters are on the track list
      - command: track add b4erbel
        name: Cannot track non-existing characters
        expect: Character.*does not exist
      - command: track add b4erbel
        name: Cannot remove non-existing characters from tracking list
        expect: Character.*does not exist
      - command: track add regolus
        name: Start tracking a dummy user
        expect: has been added
      - command: track
        name: Tracking list should now show the dummy
        expect: Regolus
      - command: test sleep 1
        name: Sleep 12s before logging in the dummy
        expect: ^$
      - command: test logon Regolus
        name: Let the dummy logon
        capture: aopriv
        expect-captured: TRACK.*Regolus.*logged.*on
      - command: track
        name: Tracking list should now show the dummy as online
        expect: Regolus.*logon
      - command: track online
        name: Tracking online list should now show the dummy as online as well
        expect: Regolus
      - command: track hide Regolus
        name: We can hide the dummy from the tracking online list
        expect: is no longer shown
      - command: track hide {uid}
        name: This also works with UIDs instead of names
        expect: is no longer shown
      - command: track online
        name: Tracking online list should now be empty
        expect: No tracked players are currently online
      - command: track unhide Regolus
        name: Stop hiding the dummy
        expect: is now shown
      - command: track unhide {uid}
        name: Stop hiding the dummy's UID should do the same
        expect: is now shown
      - command: track online
        name: Tracking online list should now show the dummy as online again
        expect: Regolus
      - command: test logoff regolus
        name: Let the dummy logoff
        capture: aopriv
        expect-captured: TRACK.*Regolus.*logged.*off
      - command: track
        name: Tracking list should now show the dummy as offline
        expect: Regolus.*logoff
      - command: track online
        name: Tracking online list should now be empty
        expect: No tracked players are currently online
      - command: track show Regolus
        name: Check the track history for our dummy for having recorded the logon/logoff events
        expect:
          - logoff
          - logon
          - All events for Regolus
          - 'Added:'
      - command: track rem Regolus
        name: Remove the dummy from out tracking list
        expect: has been removed
      - command: track rem Regolus
        name: Removing the dummy a second time gives an error
        expect: is not on the track list
      - command: track rem {uid}
        name: Stop tracking a dummy user by their UID will now also give errors
        expect: is not on the track list
        
  - name: Org tracking functions
    tests:
      - command: track orgs
        name: There are currently no orgs being tracked
        expect: There are currently no orgs being tracked
      - command: track addorg Team Rainbow
        name: Add an org to our org-tracker list
        expect:
          - Org Search Results
          - Team Rainbow \(<clan>Clan<end>\), ID (?<org_id>\d+)
      - command: track addorg {org_id}
        name: Add them by their org ID
        expect:
          - Adding.*Team Rainbow.* to the tracker
          - Added all members of.*Team Rainbow.*to the roster
      - command: track orgs
        name: The tracked org should now show up in our list
        expect:
          - Orgs being tracked
          - Team Rainbow
      - command: track remorg {org_id}
        name: Remove the tracked org again
        expect: The org.*Team Rainbow.*is no longer being tracked