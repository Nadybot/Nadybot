---
name: Whois Module
groups:

  - name: Whois command
    tests:
      - command: whois <superadmin>
        name: Get whois-information about us
        expect: Detailed Info for
      - command: whois b4erbel
        name: Non-existent characters give errors
        expect: Character.*does not exist
      - command: whois nady 5
        name: We can get information about chars on RK5
        expect: '220'
      - command: whois Deylaw 6
        name: Also on RK19
        expect: '377050696'
      - command: whois 960756792
        name: We can get information about a UID
        expect: Nadybot

  - name: History command
    tests:
      - command: history <superadmin>
        name: Get history of us in this dimension
        expect: History of
      - command: history b4erbel
        name: Getting history of a non-existing character gives a message
        expect: Could not get History of B4erbel
      - command: history regolus 5
        name: Get explicit history for a dummy in RK5
        expect: History of Regolus for RK5
      - command: history regolus 1
        name: We can also get history for chars of Atlanteen
        expect: History of Regolus for RK1
      - command: history chrisax 2
        name: And for Rimor
        expect: History of Chrisax for RK2

  - name: Lookup command
    tests:
      - command: lookup <superadmin>
        name: Get the UID for ourself
        expect: tell [<]myname[>] lookup (?<uid>\d+)
      - command: lookup {uid}
        name: And now look up the name for the UID
        expect:
          - Name History for {uid}
          - <superadmin>
      - command: lookup 11
        name: Non-existing UIDs give errors
        expect: Either that character is currently inactive

  - name: Findplayer command
    tests:
      - command: findplayer e
        name: We can search for known characters by substrings
        expect:
          - Search results for "e" \(\d+\)
          - Male|Female
      - command: findplayer b4erbel
        name: If no match is found, give an error
        expect: Could not find any players matching