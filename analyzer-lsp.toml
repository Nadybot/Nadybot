[global]
# Default debounce for onChange tools in milliseconds.
debounce_ms = 500
# Default process timeout in seconds.
timeout_seconds = 120

# PHPStan - runs on save because it is typically slow.
[[tools]]
name = "phpstan"
command = "./vendor/bin/phpstan"
startup_command = "./vendor/bin/phpstan clear-result-cache"
args = ["--error-format=raw", "--memory-limit=1G", "--no-progress", "analyse"]
triggers = ["onSave", "onStart"]
# Override timeout because PHPStan can be slow on large codebases.
timeout_seconds = 300
format = "custom"
lint_format = "%f:%l:%m"
# PHPStan reads from the file system, not stdin.
stdin = false
severity_map = { error = "Error", warning = "Warning", notice = "Information" }
# PHPStan returns exit code 1 when it finds errors, so we ignore exit codes.
ignore_exit_code = true

